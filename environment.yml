# Conda environment for the rCEG analysis.
#
# numpy MUST be >= 2.3. The original environment had numpy 1.26.4 under Python
# 3.14, a combination numpy never supported. In it np.nanvar() silently returned
# 0.0 for every column of any array above ~400,000 elements while np.var stayed
# correct; sklearn's VarianceThreshold calls np.nanvar internally, so every
# descriptor pipeline failed and large-array reductions could have returned
# plausible-but-wrong numbers. Do not relax this pin.
#
# PYTHONHASHSEED=0 is exported by run_all.sh. Piecewise branch seeds use
# zlib.crc32 rather than builtin hash(), so results are reproducible regardless,
# but the variable is fixed as a second safeguard.
name: rceg
channels: [conda-forge]
dependencies:
  - python=3.14
  - pip
  - pip:
      - numpy>=2.3,<3
      - pandas>=2.3
      - scikit-learn>=1.8
      - scipy>=1.16
      - rdkit>=2025.3
      - matplotlib>=3.10
      - joblib>=1.5
      - tabulate>=0.9
# Quantum chemistry (reference recomputation + geometry sensitivity) needs a
# separate env, since psi4 pins an older numpy:
#   conda create -n rceg_qc -c conda-forge psi4 xtb rdkit pandas
